services:
  test:
    # Digest-pinned: the dev-only toolchain image should not change under the
    # test job. The tag stays alongside it so the Go version remains readable.
    image: golang:1.27@sha256:820153096fda4de6ac1b7194d12e416b7dd8f4e9a33d17e0345b111b945162d8
    volumes:
      - ..:/workspaces/terraform-provider-rustfs
      - go-modules:/go/pkg/mod
      - terraform-bin:/usr/local/terraform
    working_dir: /workspaces/terraform-provider-rustfs
    command:
      - bash
      - -c
      - |
        TERRAFORM_VERSION=1.11.4
        TERRAFORM_BIN=/usr/local/terraform/terraform
        if [ -f "$$TERRAFORM_BIN" ]; then
          echo "Using cached Terraform..."
        else
          echo "Downloading Terraform $$TERRAFORM_VERSION..."
          apt-get update -qq && apt-get install -y -qq unzip >/dev/null 2>&1
          wget -q -O /tmp/terraform.zip "https://releases.hashicorp.com/terraform/$${TERRAFORM_VERSION}/terraform_$${TERRAFORM_VERSION}_linux_amd64.zip"
          unzip -o /tmp/terraform.zip -d /usr/local/terraform
          rm /tmp/terraform.zip
        fi
        ln -sf $$TERRAFORM_BIN /usr/local/bin/terraform
        go mod download
        go build ./...
        TF_ACC=1 go test -v -failfast -timeout 30m ./provider $${TEST_FILTER:+-run $$TEST_FILTER}
    environment:
      TF_ACC: "1"
      RUSTFS_ENDPOINT: "rustfs:9001"
      RUSTFS_USER: "rustfsadmin"
      RUSTFS_SECRET: "rustfsadmin"
      RUSTFS_NOTIFY_TEST_ENDPOINT: "http://127.0.0.1:9001/health/ready"
      TEST_FILTER: "${TEST_FILTER:-TestAcc}"
    depends_on:
      rustfs:
        condition: service_started
    profiles:
      - test

  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:-latest}
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      # The notify and audit feature modules are intentionally NOT pinned with
      # RUSTFS_NOTIFY_ENABLE/RUSTFS_AUDIT_ENABLE here: RustFS then rejects every
      # admin API update to those modules, which breaks the acceptance tests
      # (TestAccModuleSwitchResource, and the target prechecks). The audit and
      # notification target tests enable their own module through the admin API
      # and restore it afterwards.
      RUSTFS_OUTBOUND_ALLOW_ORIGINS: "http://127.0.0.1:9001"
      RUSTFS_KMS_ENABLE: "true"
      RUSTFS_KMS_BACKEND: "local"
      RUSTFS_KMS_KEY_DIR: "/data/kms"
      RUSTFS_KMS_LOCAL_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      RUSTFS_KMS_DEFAULT_KEY_ID: "rustfs-default-key"
      RUSTFS_KMS_ALLOW_INSECURE_DEV_DEFAULTS: "true"

volumes:
  go-modules:
  terraform-bin:

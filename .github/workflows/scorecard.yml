# OpenSSF Scorecard: weekly supply-chain security assessment of this repository.
#
# The result is published to the OpenSSF API (which is what the README badge reads)
# and uploaded to GitHub code scanning as SARIF. It runs on main, on a schedule and
# whenever branch protection changes, because several checks look at exactly that.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Mondays, 04:23 UTC (off the top of the hour: the OpenSSF API is busy then).
    - cron: "23 4 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload the SARIF result to code scanning
      id-token: write # publish_results signs the result through OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the SARIF result as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload the SARIF result to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

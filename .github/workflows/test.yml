name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned so CI and local runs agree on the linter set and gofmt
          # behaviour (tracked in .github/golangci.yml).
          version: v2.14.0
          args: --config .github/golangci.yml

      - name: Run Gosec Security Scanner
        id: gosec
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        continue-on-error: true
        env:
          GOTOOLCHAIN: auto
        with:
          args: -fmt sarif -out gosec.sarif -exclude-dir=vendor -tests=false ./

      - name: Upload security scan results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && hashFiles('gosec.sarif') != ''
        with:
          sarif_file: gosec.sarif

      - name: Fail on Gosec findings
        if: always() && steps.gosec.outcome == 'failure'
        run: |
          echo "## Gosec Security Scanner Found Issues" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f gosec.sarif ]; then
            echo "| Rule | File | Line | Description |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|------|-------------|" >> $GITHUB_STEP_SUMMARY
            jq -r '.runs[0].results[] | "| \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri) | \(.locations[0].physicalLocation.region.startLine) | \(.message.text) |"' gosec.sarif >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See the **Security** tab for full details." >> $GITHUB_STEP_SUMMARY
          exit 1

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Validate examples
        run: ./scripts/validate-examples.sh

      # Narrow to ./internal/... once the code layout lands (#8-#11).
      - name: Run tests
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: always()
        run: |
          if [[ ! -f coverage.out ]]; then
            echo "No coverage profile: the test step failed before writing one." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Coverage"
            echo ""
            echo "Unit tests only: the acceptance suite skips itself without \`TF_ACC\`, so"
            echo "packages whose behaviour is covered by \`TestAcc*\` (mostly \`provider\`) read low."
            echo "Run \`make coverage\` locally, or see the acceptance job for the live suite."
            echo ""
            ./scripts/coverage-summary.sh coverage.out
          } >> "$GITHUB_STEP_SUMMARY"
          ./scripts/coverage-summary.sh coverage.out

  rustfs_versions:
    name: Supported RustFS Versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only the acceptance job consumes this, and that job only runs on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the supported versions into a JSON array
        id: read
        run: |
          list=$(jq -R -s -c 'split("\n") | map(select(length > 0))' .github/rustfs-versions.txt)
          echo "list=$list" >> "$GITHUB_OUTPUT"

  acceptance:
    name: Acceptance Tests (RustFS ${{ matrix.rustfs }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - test
      - rustfs_versions
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        # Single source of truth: .github/rustfs-versions.txt.
        rustfs: ${{ fromJSON(needs.rustfs_versions.outputs.list) }}
    env:
      RUSTFS_VERSION: ${{ matrix.rustfs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # The acceptance container writes coverage-acceptance.out into the mounted
      # worktree; the unit profile is produced here so both can be merged into the
      # one statement-coverage number the project publishes (see
      # .github/OPENSSF-BEST-PRACTICES.md).
      - name: Unit-test coverage
        run: go test -count=1 -skip '^TestAcc' -covermode=atomic -coverprofile=coverage-unit.out ./...

      - name: Run acceptance tests
        run: docker compose -f acc_test/docker-compose.yml --profile test run --rm test

      - name: Combined coverage (unit + acceptance)
        if: always()
        run: |
          if [[ ! -f coverage-acceptance.out ]]; then
            echo "No acceptance coverage profile: the container run did not finish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ./scripts/merge-coverage.sh coverage-union.out coverage-unit.out coverage-acceptance.out
          {
            echo "## Coverage (unit + acceptance)"
            echo ""
            echo "\`coverage-unit.out\` and \`coverage-acceptance.out\` merged by \`scripts/merge-coverage.sh\`."
            echo ""
            ./scripts/coverage-summary.sh coverage-union.out
          } >> "$GITHUB_STEP_SUMMARY"

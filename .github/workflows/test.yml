name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
          # The scanner is built from .github/gosec, a nested module, so its
          # go.sum has to be listed for setup-go to cache that module too.
          cache-dependency-path: |
            go.sum
            .github/gosec/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned so CI and local runs agree on the linter set and gofmt
          # behaviour (tracked in .github/golangci.yml).
          version: v2.14.0
          args: --config .github/golangci.yml

      # gosec v2.29.0 (the latest release) pins golang.org/x/tools v0.49.0,
      # which cannot decode the export data the Go 1.27.2 toolchain emits
      # ("export data version 5 is greater than maximum supported version 4"),
      # so the scanner exits non-zero on a clean tree. It is built from the
      # pinned v2.29.0 source with a tool-only x/tools override instead of the
      # prebuilt action (securego/gosec#1771, securego/gosec#1774); drop the
      # override once a gosec release ships golang.org/x/tools >= v0.50.0.
      - name: Run Gosec Security Scanner
        id: gosec
        continue-on-error: true
        env:
          GOTOOLCHAIN: auto
        run: |
          go build -C .github/gosec -o "$RUNNER_TEMP/gosec" github.com/securego/gosec/v2/cmd/gosec
          "$RUNNER_TEMP/gosec" -fmt sarif -out gosec.sarif -exclude-dir=vendor -tests=false ./

      - name: Upload security scan results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && hashFiles('gosec.sarif') != ''
        with:
          sarif_file: gosec.sarif

      - name: Fail on Gosec findings
        if: always() && steps.gosec.outcome == 'failure'
        run: |
          echo "## Gosec Security Scanner Found Issues" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f gosec.sarif ]; then
            echo "| Rule | File | Line | Description |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|------|-------------|" >> $GITHUB_STEP_SUMMARY
            jq -r '.runs[0].results[] | "| \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri) | \(.locations[0].physicalLocation.region.startLine) | \(.message.text) |"' gosec.sarif >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See the **Security** tab for full details." >> $GITHUB_STEP_SUMMARY
          exit 1

  govulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # Pinned like golangci-lint so a new release cannot change the gate
      # silently. The scanner needs no RustFS server: it walks the module
      # graph and the call graph against the Go vulnerability database.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run govulncheck
        run: govulncheck ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Validate examples
        run: ./scripts/validate-examples.sh

      # Narrow to ./internal/... once the code layout lands (#8-#11).
      - name: Run tests
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: always()
        run: |
          if [[ ! -f coverage.out ]]; then
            echo "No coverage profile: the test step failed before writing one." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Coverage"
            echo ""
            echo "Unit tests only: the acceptance suite skips itself without \`TF_ACC\`, so"
            echo "packages whose behaviour is covered by \`TestAcc*\` (mostly \`provider\`) read low."
            echo "Run \`make coverage\` locally, or see the acceptance job for the live suite."
            echo ""
            ./scripts/coverage-summary.sh coverage.out
          } >> "$GITHUB_STEP_SUMMARY"
          ./scripts/coverage-summary.sh coverage.out

  # A pull request cannot make the project less tested: merge the unit profile
  # with an acceptance profile from the newest RustFS release and fail when the
  # result is below .github/coverage-baseline.txt. `main` repeats this gate in
  # the `latest` cell of the acceptance matrix (see the acceptance job below).
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # README.md carries the coverage badge and block, both generated from the
      # baseline by scripts/coverage-readme.sh.
      - name: README in sync with the coverage baseline
        run: ./scripts/coverage-readme.sh --check

      - name: Unit-test coverage
        run: go test -count=1 -skip '^TestAcc' -covermode=atomic -coverprofile=coverage-unit.out ./...

      # The container writes coverage-acceptance.out into the mounted worktree.
      - name: Run acceptance tests
        run: docker compose -f acc_test/docker-compose.yml --profile test run --rm test

      - name: Coverage gate (unit + acceptance)
        run: |
          ./scripts/merge-coverage.sh coverage-union.out coverage-unit.out coverage-acceptance.out
          ./scripts/coverage-gate.sh coverage-union.out
          ./scripts/coverage-summary.sh coverage-union.out
          {
            echo "## Coverage (unit + acceptance)"
            echo ""
            echo "\`coverage-unit.out\` and \`coverage-acceptance.out\` merged by \`scripts/merge-coverage.sh\`."
            echo "The gate compares the total, \`provider\` and \`pkg/rustfs\` against \`.github/coverage-baseline.txt\`."
            echo ""
            ./scripts/coverage-summary.sh coverage-union.out
          } >> "$GITHUB_STEP_SUMMARY"

  rustfs_versions:
    name: Supported RustFS Versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only the acceptance job consumes this, and that job only runs on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the supported versions into a JSON array
        id: read
        run: |
          list=$(jq -R -s -c 'split("\n") | map(select(length > 0))' .github/rustfs-versions.txt)
          echo "list=$list" >> "$GITHUB_OUTPUT"

  acceptance:
    name: Acceptance Tests (RustFS ${{ matrix.rustfs }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - test
      - rustfs_versions
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        # Single source of truth: .github/rustfs-versions.txt.
        rustfs: ${{ fromJSON(needs.rustfs_versions.outputs.list) }}
    env:
      RUSTFS_VERSION: ${{ matrix.rustfs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # The acceptance container writes coverage-acceptance.out into the mounted
      # worktree; the unit profile is produced here so both can be merged into the
      # one statement-coverage number the project publishes (see
      # .github/OPENSSF-BEST-PRACTICES.md).
      - name: Unit-test coverage
        run: go test -count=1 -skip '^TestAcc' -covermode=atomic -coverprofile=coverage-unit.out ./...

      - name: Run acceptance tests
        run: docker compose -f acc_test/docker-compose.yml --profile test run --rm test

      - name: Combined coverage (unit + acceptance)
        if: always()
        run: |
          if [[ ! -f coverage-acceptance.out ]]; then
            echo "No acceptance coverage profile: the container run did not finish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ./scripts/merge-coverage.sh coverage-union.out coverage-unit.out coverage-acceptance.out
          {
            echo "## Coverage (unit + acceptance)"
            echo ""
            echo "\`coverage-unit.out\` and \`coverage-acceptance.out\` merged by \`scripts/merge-coverage.sh\`."
            echo ""
            ./scripts/coverage-summary.sh coverage-union.out
          } >> "$GITHUB_STEP_SUMMARY"
          ./scripts/coverage-summary.sh coverage-union.out

      # The floor is calibrated against the newest release; the older cells of
      # the matrix legitimately skip version-gated tests, so they do not gate.
      - name: Coverage gate (unit + acceptance)
        if: matrix.rustfs == 'latest'
        run: ./scripts/coverage-gate.sh coverage-union.out

changelog:
  exclude:
    labels:
      - ignore-for-release
      - skip-changelog
    authors:
      - dependabot
      - dependabot[bot]

  categories:
    # The changelog fragment kinds (breaking, feature, improvement, bugfix,
    # security, chore) map onto these titles; the remaining categories apply to
    # label-driven GitHub release notes.
    - title: "Breaking Changes"
      labels:
        - breaking
    - title: "Features"
      labels:
        - feature
        - enhancement
        - feat
    - title: "Improvements"
      labels:
        - improvement
    - title: "Bug Fixes"
      labels:
        - bug
        - fix
        - bugfix
    - title: "Documentation"
      labels:
        - documentation
        - docs
    - title: "Security"
      labels:
        - security
    - title: "Chores"
      labels:
        - chore
        - maintenance
        - refactor
    - title: "Dependencies"
      labels:
        - dependencies
        - deps
    - title: "Tests"
      labels:
        - test
        - tests
        - testing
    - title: "Other Changes"
      labels:
        - "*"
